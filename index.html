    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="css/leaflet.css" />

        height: 100vh;

    <div id="map"></div>

    <script>
      var highlightLayer;
      function highlightFeature(e) {
        highlightLayer = e.target;

        if (
          e.target.feature.geometry.type === "LineString" ||
          e.target.feature.geometry.type === "MultiLineString"
        ) {
          highlightLayer.setStyle({
            color: "#ffff00",
          });
        } else {
          highlightLayer.setStyle({
            fillColor: "#ffff00",
            fillOpacity: 0.3,
          });
        }
      }

      var map = L.map("map", {
        zoomControl: false,
        maxZoom: 28,
        minZoom: 1,
      }).fitBounds([
        [12.807248991172795, 77.33959259033578],
        [13.17872576117281, 77.94952630491066],
      ]);
      var hash = new L.Hash(map);
      map.attributionControl.setPrefix("");
      var autolinker = new Autolinker({
        truncate: { length: 30, location: "smart" },
      });
      // remove popup's row if "visible-with-data"
      function removeEmptyRowsFromPopupContent(content, feature) {
        var tempDiv = document.createElement("div");
        tempDiv.innerHTML = content;
        var rows = tempDiv.querySelectorAll("tr");
        for (var i = 0; i < rows.length; i++) {
          var td = rows[i].querySelector("td.visible-with-data");
          var key = td ? td.id : "";
          if (
            td &&
            td.classList.contains("visible-with-data") &&
            feature.properties[key] == null
          ) {
            rows[i].parentNode.removeChild(rows[i]);
          }
        }
        return tempDiv.innerHTML;
      }
      var zoomControl = L.control
        .zoom({
          position: "topleft",
        })
        .addTo(map);
      var bounds_group = new L.featureGroup([]);
      function setBounds() {}
      map.createPane("pane_OSMStandard_0");
      map.getPane("pane_OSMStandard_0").style.zIndex = 400;
      var layer_OSMStandard_0 = L.tileLayer(
        "http://tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          pane: "pane_OSMStandard_0",
          opacity: 1.0,
          attribution: "",
          minZoom: 1,
          maxZoom: 28,
          minNativeZoom: 0,
          maxNativeZoom: 19,
        }
      );
      layer_OSMStandard_0;
      map.addLayer(layer_OSMStandard_0);

      // Add black & white OSM layer
      var layer_OSMBW = L.tileLayer(
        "http://tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          pane: "pane_OSMStandard_0",
          opacity: 1.0,
          attribution: "",
          minZoom: 1,
          maxZoom: 28,
          minNativeZoom: 0,
          maxNativeZoom: 19,
          className: "bw-tiles",
        }
      );

      // Add CSS for black & white filter
      var style = document.createElement("style");
      style.innerHTML = ".bw-tiles { filter: grayscale(100%); }";
      document.head.appendChild(style);

      // Create empty layer for "no base layer" option
      var layer_NoBase = L.layerGroup([]);

      function pop_municipalities(feature, layer) {
        layer.on({
          mouseout: function (e) {
            for (var i in e.target._eventParents) {
              if (typeof e.target._eventParents[i].resetStyle === "function") {
                e.target._eventParents[i].resetStyle(e.target);
              }
            }
          },
          mouseover: highlightFeature,
        });
        var popupContent =
          '<table>\
                    <tr>\
                        <td style="font-weight: bold; color: #333;"><strong>Municipality</strong></td>\
                    </tr>\
                    <tr>\
                        <td>' +
          (feature.properties["NewCorp"] !== null
            ? autolinker.link(
                String(feature.properties["NewCorp"])
                  .replace(/'/g, "'")
                  .toLocaleString()
              )
            : "") +
          "</td>\
                    </tr>\
                </table>";
        var content = removeEmptyRowsFromPopupContent(popupContent, feature);
        layer.bindPopup(content, { maxHeight: 400 });
      }

      function pop_wards(feature, layer) {
        layer.on({
          mouseout: function (e) {
            for (var i in e.target._eventParents) {
              if (typeof e.target._eventParents[i].resetStyle === "function") {

              }

          mouseover: highlightFeature,
        });
        var popupContent =
          '<table>\
                    <tr>\

                    </tr>\
                    <tr>\
                        <td>' +
          (feature.properties["proposed_ward_name_en"] !== null
            ? autolinker.link(
                String(feature.properties["proposed_ward_name_en"]).replace(
                  /'/g,
                  "'"

            : "") +
          '</td>\
                    </tr>\
                    <tr>\
                        <td style="font-weight: bold; color: #333;"><strong>Ward Name (Kannada)</strong></td>\
                    </tr>\
                    <tr>\
                        <td>' +
          (feature.properties["proposed_ward_name_ka"] !== null
            ? autolinker.link(
                String(feature.properties["proposed_ward_name_ka"]).replace(
                  /'/g,
                  "'"
                )
              )
            : "") +
          '</td>\
                    </tr>\
                    <tr>\
                        <td style="font-weight: bold; color: #333;"><strong>Ward Area (sq km)</strong></td>\
                    </tr>\
                    <tr>\
                        <td>' +
          (feature.properties["ward_area"] !== null
            ? Number(feature.properties["ward_area"]).toFixed(1)
            : "") +
          '</td>\
                    </tr>\
                    <tr>\
                        <td style="font-weight: bold; color: #333;"><strong>Municipality (English)</strong></td>\
                    </tr>\
                    <tr>\
                        <td>' +
          (feature.properties["name_en"] !== null
            ? autolinker.link(
                String(feature.properties["name_en"]).replace(/'/g, "'")
              )
            : "") +
          '</td>\
                    </tr>\
                    <tr>\
                        <td style="font-weight: bold; color: #333;"><strong>Municipality (Kannada)</strong></td>\
                    </tr>\
                    <tr>\
                        <td>' +
          (feature.properties["name_ka"] !== null
            ? autolinker.link(
                String(feature.properties["name_ka"]).replace(/'/g, "'")
              )
            : "") +
          '</td>\
                    </tr>\
                    <tr>\
                        <td style="font-weight: bold; color: #333;"><strong>Population</strong></td>\
                    </tr>\
                    <tr>\
                        <td>' +
          (feature.properties["population"] !== null
            ? Number(feature.properties["population"]).toLocaleString()
            : "") +
          '</td>\
                    </tr>\
                    <tr>\
                        <td style="font-weight: bold; color: #333;"><strong>SC Population</strong></td>\
                    </tr>\
                    <tr>\
                        <td>' +
          (feature.properties["sc_population"] !== null
            ? Number(feature.properties["sc_population"]).toLocaleString()
            : "") +
          '</td>\
                    </tr>\
                    <tr>\
                        <td style="font-weight: bold; color: #333;"><strong>ST Population</strong></td>\
                    </tr>\
                    <tr>\
                        <td>' +
          (feature.properties["st_population"] !== null
            ? Number(feature.properties["st_population"]).toLocaleString()
            : "") +
          '</td>\
                    </tr>\
                    <tr>\
                        <td style="font-weight: bold; color: #333;"><strong>Male Population</strong></td>\
                    </tr>\
                    <tr>\
                        <td>' +
          (feature.properties["male_population"] !== null
            ? Number(feature.properties["male_population"]).toLocaleString()
            : "") +
          '</td>\
                    </tr>\
                    <tr>\
                        <td style="font-weight: bold; color: #333;"><strong>Female Population</strong></td>\
                    </tr>\
                    <tr>\
                        <td>' +
          (feature.properties["female_population"] !== null
            ? Number(feature.properties["female_population"]).toLocaleString()
            : "") +
          '</td>\
                    </tr>\
                    <tr>\
                        <td style="font-weight: bold; color: #333;"><strong>Assembly Constituency</strong></td>\
                    </tr>\
                    <tr>\
                        <td>' +
          (feature.properties["assembly_constituency_name_en"] !== null
            ? autolinker.link(
                String(
                  feature.properties["assembly_constituency_name_en"]
                ).replace(/'/g, "'")
              )
            : "") +
          '</td>\
                    </tr>\
                    <tr>\
                        <td style="font-weight: bold; color: #333;"><strong>Parliamentary Constituency (English)</strong></td>\
                    </tr>\
                    <tr>\
                        <td>' +
          (feature.properties["parliamentary_constituency_name_en"] !== null
            ? autolinker.link(
                String(
                  feature.properties["parliamentary_constituency_name_en"]
                ).replace(/'/g, "'")
              )
            : "") +
          '</td>\
                    </tr>\
                    <tr>\
                        <td style="font-weight: bold; color: #333;"><strong>Parliamentary Constituency (Kannada)</strong></td>\
                    </tr>\
                    <tr>\
                        <td>' +
          (feature.properties["parliamentary_constituency_name_ka"] !== null
            ? autolinker.link(
                String(
                  feature.properties["parliamentary_constituency_name_ka"]
                ).replace(/'/g, "'")
              )
            : "") +
          "</td>\
                    </tr>\
                </table>";
        var content = removeEmptyRowsFromPopupContent(popupContent, feature);
        layer.bindPopup(content, { maxHeight: 400 });
      }

      function pop_swd_primary(feature, layer) {
        layer.on({
          mouseout: function (e) {
            for (var i in e.target._eventParents) {
              if (typeof e.target._eventParents[i].resetStyle === "function") {
                e.target._eventParents[i].resetStyle(e.target);
              }
            }
          },
          mouseover: highlightFeature,
        });
        var popupContent =
          '<table>\
                    <tr>\
                        <th colspan="2" style="color: rgba(255,140,0,1.0); padding: 8px; font-size: 14px; text-align: center;">Primary Storm Water Drain</th>\
                    </tr>';

        var hasData = false;

        // Name
        if (
          feature.properties["name"] !== null &&
          feature.properties["name"] !== undefined &&
          feature.properties["name"] !== ""
        ) {
          hasData = true;
          popupContent +=
            '\
                    <tr>\
                        <td style="font-weight: bold; color: #333; text-align: center;"><strong>Name</strong></td>\
                    </tr>\
                    <tr>\
                        <td style="text-align: center;">' +
            autolinker.link(
              String(feature.properties["name"])
                .replace(/'/g, "'")
                .toLocaleString()
            ) +
            "</td>\
                    </tr>";
        }

        // Length
        if (
          feature.properties["SHAPE_Leng"] !== null &&
          feature.properties["SHAPE_Leng"] !== undefined
        ) {
          hasData = true;
          popupContent +=
            '\
                    <tr>\
                        <td style="font-weight: bold; color: #333; text-align: center;"><strong>Length (m)</strong></td>\
                    </tr>\
                    <tr>\
                        <td style="text-align: center;">' +
            Number(feature.properties["SHAPE_Leng"]).toLocaleString(undefined, {
              minimumFractionDigits: 2,
              maximumFractionDigits: 2,
            }) +
            "</td>\
                    </tr>";
        }

        if (!hasData) {
          popupContent +=
            '\
                    <tr>\
                        <td style="font-style: italic; color: #666; padding: 10px; text-align: center;">No data available</td>\
                    </tr>';
        }

        popupContent += "</table>";
        var content = removeEmptyRowsFromPopupContent(popupContent, feature);
        layer.bindPopup(content, { maxHeight: 400 });
      }

      function pop_swd_secondary(feature, layer) {
        layer.on({
          mouseout: function (e) {
            for (var i in e.target._eventParents) {
              if (typeof e.target._eventParents[i].resetStyle === "function") {
                e.target._eventParents[i].resetStyle(e.target);
              }
            }
          },
          mouseover: highlightFeature,
        });
        var popupContent =
          '<table>\
                    <tr>\
                        <th colspan="2" style="color: rgba(255,165,79,1.0); padding: 8px; font-size: 14px; text-align: center;">Secondary Storm Water Drain</th>\
                    </tr>';

        var hasData = false;

        // Name
        if (
          feature.properties["name"] !== null &&
          feature.properties["name"] !== undefined &&
          feature.properties["name"] !== ""
        ) {
          hasData = true;
          popupContent +=
            '\
                    <tr>\
                        <td style="font-weight: bold; color: #333; text-align: center;"><strong>Name</strong></td>\
                    </tr>\
                    <tr>\
                        <td style="text-align: center;">' +
            autolinker.link(
              String(feature.properties["name"])
                .replace(/'/g, "'")
                .toLocaleString()
            ) +
            "</td>\
                    </tr>";
        }

        // Length
        if (
          feature.properties["SHAPE_Leng"] !== null &&
          feature.properties["SHAPE_Leng"] !== undefined
        ) {
          hasData = true;
          popupContent +=
            '\
                    <tr>\
                        <td style="font-weight: bold; color: #333; text-align: center;"><strong>Length (m)</strong></td>\
                    </tr>\
                    <tr>\
                        <td style="text-align: center;">' +
            Number(feature.properties["SHAPE_Leng"]).toLocaleString(undefined, {
              minimumFractionDigits: 2,
              maximumFractionDigits: 2,
            }) +
            "</td>\
                    </tr>";
        }

        if (!hasData) {
          popupContent +=
            '\
                    <tr>\
                        <td style="font-style: italic; color: #666; padding: 10px; text-align: center;">No data available</td>\
                    </tr>';
        }

        popupContent += "</table>";
        var content = removeEmptyRowsFromPopupContent(popupContent, feature);
        layer.bindPopup(content, { maxHeight: 400 });
      }

      function style_municipalities() {
        return {
          pane: "pane_municipalities",
          opacity: 1,
          color: "rgba(0,0,0,1.0)",
          dashArray: "",
          lineCap: "butt",
          lineJoin: "miter",
          weight: 1,
          fill: true,
          fillOpacity: 0.2,
          fillColor: "rgba(200,200,200,1.0)",
          interactive: true,
        };
      }
      function style_wards() {
        return {
          pane: "pane_wards",
          opacity: 1,
          color: "rgba(0,0,0,1.0)", // Steel blue border
          dashArray: "",
          lineCap: "butt",
          lineJoin: "miter",
          weight: 0.5,
          fill: true,
          fillOpacity: 0.3,
          fillColor: "rgba(135,206,250,1.0)", // Light sky blue fill
          interactive: true,
        };
      }

      function style_swd_primary() {
        return {
          pane: "pane_swd_primary",
          opacity: 0.8,
          color: "rgba(65,105,225,1.0)", // Royal blue - calmer, more professional
          dashArray: "",
          lineCap: "round",
          lineJoin: "round",
          weight: 3,
          fill: false,
          interactive: true,
        };
      }

      function style_swd_secondary() {
        return {
          pane: "pane_swd_secondary",
          opacity: 0.8,
          color: "rgba(100,149,237,1.0)", // Cornflower blue - lighter, less prominent
          dashArray: "4, 6",
          lineCap: "round",
          lineJoin: "round",
          weight: 2,
          fill: false,
          interactive: true,
        };
      }

      map.createPane("pane_municipalities");
      map.getPane("pane_municipalities").style.zIndex = 401;
      map.getPane("pane_municipalities").style["mix-blend-mode"] = "normal";
      var layer_municipalities = new L.geoJson(json_municipalities, {
        attribution: "",
        interactive: true,
        dataVar: "json_municipalities",
        layerName: "layer_municipalities",
        pane: "pane_municipalities",
        onEachFeature: pop_municipalities,
        style: style_municipalities,
      });
      bounds_group.addLayer(layer_municipalities);
      map.addLayer(layer_municipalities);
      map.createPane("pane_wards");
      map.getPane("pane_wards").style.zIndex = 402;
      map.getPane("pane_wards").style["mix-blend-mode"] = "normal";
      var layer_wards = new L.geoJson(json_wards, {
        attribution: "",
        interactive: true,
        dataVar: "json_wards",
        layerName: "layer_wards",
        pane: "pane_wards",
        onEachFeature: pop_wards,
        style: style_wards,
      });
      bounds_group.addLayer(layer_wards);
      map.addLayer(layer_wards);

      map.createPane("pane_swd_primary");
      map.getPane("pane_swd_primary").style.zIndex = 403;
      map.getPane("pane_swd_primary").style["mix-blend-mode"] = "normal";
      var layer_swd_primary = new L.geoJson(json_swd_primary, {
        attribution: "",
        interactive: true,
        dataVar: "json_swd_primary",
        layerName: "layer_swd_primary",
        pane: "pane_swd_primary",
        onEachFeature: pop_swd_primary,
        style: style_swd_primary,
      });
      bounds_group.addLayer(layer_swd_primary);
      map.addLayer(layer_swd_primary);

      map.createPane("pane_swd_secondary");
      map.getPane("pane_swd_secondary").style.zIndex = 404;
      map.getPane("pane_swd_secondary").style["mix-blend-mode"] = "normal";
      var layer_swd_secondary = new L.geoJson(json_swd_secondary, {
        attribution: "",
        interactive: true,
        dataVar: "json_swd_secondary",
        layerName: "layer_swd_secondary",
        pane: "pane_swd_secondary",
        onEachFeature: pop_swd_secondary,
        style: style_swd_secondary,
      });
      bounds_group.addLayer(layer_swd_secondary);
      map.addLayer(layer_swd_secondary);

      function pop_lakes(feature, layer) {
        layer.on({
          mouseout: function (e) {
            for (var i in e.target._eventParents) {
              if (typeof e.target._eventParents[i].resetStyle === "function") {
                e.target._eventParents[i].resetStyle(e.target);
              }
            }
          },
          mouseover: highlightFeature,
        });
        var popupContent = "<table>";

        // Lake Name
        if (
          feature.properties["Name_of_th"] !== null &&
          feature.properties["Name_of_th"] !== undefined &&
          feature.properties["Name_of_th"] !== "" &&
          feature.properties["Name_of_th"] !== "-na-"
        ) {
          popupContent +=
            '\
                          <tr>\
                              <td style="font-weight: bold; color: #333;"><strong>Lake Name</strong></td>\
                          </tr>\
                          <tr>\
                              <td>' +
            autolinker.link(
              String(feature.properties["Name_of_th"])
                .replace(/'/g, "'")
                .toLocaleString()
            ) +
            "</td>\
                          </tr>";
        }

        // Area
        if (
          feature.properties["Area"] !== null &&
          feature.properties["Area"] !== undefined &&
          feature.properties["Area"] !== "" &&
          feature.properties["Area"] !== "-na-"
        ) {
          popupContent +=
            '\
                          <tr>\
                              <td style="font-weight: bold; color: #333;"><strong>Area (acres)</strong></td>\
                          </tr>\
                          <tr>\
                              <td>' +
            autolinker.link(
              String(feature.properties["Area"])
                .replace(/'/g, "'")
                .toLocaleString()
            ) +
            "</td>\
                          </tr>";
        }

        // Ward Number
        if (
          feature.properties["Ward_Numbe"] !== null &&
          feature.properties["Ward_Numbe"] !== undefined &&
          feature.properties["Ward_Numbe"] !== "" &&
          feature.properties["Ward_Numbe"] !== "-na-"
        ) {
          popupContent +=
            '\
                          <tr>\
                              <td style="font-weight: bold; color: #333;"><strong>Ward Number</strong></td>\
                          </tr>\
                          <tr>\
                              <td>' +
            autolinker.link(
              String(feature.properties["Ward_Numbe"])
                .replace(/'/g, "'")
                .toLocaleString()
            ) +
            "</td>\
                          </tr>";
        }

        // Ward Councillor
        if (
          feature.properties["Ward-Couns"] !== null &&
          feature.properties["Ward-Couns"] !== undefined &&
          feature.properties["Ward-Couns"] !== "" &&
          feature.properties["Ward-Couns"] !== "-na-"
        ) {
          popupContent +=
            '\
                          <tr>\
                              <td style="font-weight: bold; color: #333;"><strong>Ward Councillor</strong></td>\
                          </tr>\
                          <tr>\
                              <td>' +
            autolinker.link(
              String(feature.properties["Ward-Couns"]).replace(/'/g, "'")
            ) +
            "</td>\
                          </tr>";
        }

        // Ward Office
        if (
          feature.properties["Ward_offic"] !== null &&

          feature.properties["Ward_offic"] !== "-na-"
        ) {
          popupContent +=
            '\
                          <tr>\
                              <td style="font-weight: bold; color: #333;"><strong>Ward Office</strong></td>\
                          </tr>\
                          <tr>\
                              <td>' +
            autolinker.link(
              String(feature.properties["Ward_offic"]).replace(/'/g, "'")
            ) +
            "</td>\
                          </tr>";
        }

        // Ward Contact
        if (
          feature.properties["Ward_Conta"] !== null &&
          feature.properties["Ward_Conta"] !== undefined &&
          feature.properties["Ward_Conta"] !== "" &&
          feature.properties["Ward_Conta"] !== "-na-"
        ) {
          popupContent +=
            '\
                          <tr>\
                              <td style="font-weight: bold; color: #333;"><strong>Ward Contact</strong></td>\
                          </tr>\
                          <tr>\
                              <td>' +
            autolinker.link(
              String(feature.properties["Ward_Conta"]).replace(/'/g, "'")
            ) +
            "</td>\
                          </tr>";
        }

        // Facebook
        if (
          feature.properties["Facebook"] !== null &&
          feature.properties["Facebook"] !== undefined &&
          feature.properties["Facebook"] !== "" &&
          feature.properties["Facebook"] !== "-na-"
        ) {
          popupContent +=
            '\
                          <tr>\
                              <td style="font-weight: bold; color: #333;"><strong>Facebook</strong></td>\
                          </tr>\
                          <tr>\
                              <td>' +
            autolinker.link(
              String(feature.properties["Facebook"]).replace(/'/g, "'")
            ) +
            "</td>\
                          </tr>";
        }

        // Custodian
        if (
          feature.properties["Custodian"] !== null &&
          feature.properties["Custodian"] !== undefined &&
          feature.properties["Custodian"] !== "" &&
          feature.properties["Custodian"] !== "-na-"
        ) {
          popupContent +=
            '\
                          <tr>\
                              <td style="font-weight: bold; color: #333;"><strong>Custodian</strong></td>\
                          </tr>\
                          <tr>\
                              <td>' +
            autolinker.link(
              String(feature.properties["Custodian"]).replace(/'/g, "'")
            ) +
            "</td>\
                          </tr>";
        }

        popupContent += "</table>";
        layer.bindPopup(popupContent, { maxHeight: 400 });
      }

      function style_lakes() {
        return {
          pane: "pane_lakes",
          opacity: 1,
          color: "rgba(35,35,35,1.0)",
          dashArray: "",
          lineCap: "butt",
          lineJoin: "miter",
          weight: 1.0,
          fill: true,
          fillOpacity: 0.7,
          fillColor: "rgba(0,123,255,1.0)",
          interactive: true,
        };
      }

      map.createPane("pane_lakes");
      map.getPane("pane_lakes").style.zIndex = 405;
      map.getPane("pane_lakes").style["mix-blend-mode"] = "normal";
      var layer_lakes = new L.geoJson(json_lakes, {
        attribution: "",
        interactive: true,
        dataVar: "json_lakes",
        layerName: "layer_lakes",
        pane: "pane_lakes",
        onEachFeature: pop_lakes,
        style: style_lakes,
      });
      bounds_group.addLayer(layer_lakes);
      map.addLayer(layer_lakes);

      map.createPane("pane_flooding_locations");
      map.getPane("pane_flooding_locations").style.zIndex = 406;
      map.getPane("pane_flooding_locations").style["mix-blend-mode"] = "normal";
      var layer_flooding_locations = new L.geoJson(
        json_flood_vulnerable_locations,
        {
          attribution: "",
          interactive: true,
          dataVar: "json_flood_vulnerable_locations",
          layerName: "layer_flooding_locations",
          pane: "pane_flooding_locations",
          onEachFeature: pop_flooding_locations,
          pointToLayer: function (feature, latlng) {
            return L.circleMarker(latlng, {
              radius: 6,
              fillColor: "#e63946",
              color: "#000",
              weight: 1,
              opacity: 1,
              fillOpacity: 0.8,
            });
          },
        }
      );
      bounds_group.addLayer(layer_flooding_locations);
      map.addLayer(layer_flooding_locations);

      function pop_flooding_locations(feature, layer) {
        layer.on({
          mouseout: function (e) {
            for (var i in e.target._eventParents) {
              if (typeof e.target._eventParents[i].resetStyle === "function") {
                e.target._eventParents[i].resetStyle(e.target);
              }
            }
          },
          mouseover: highlightFeature,
        });
        var popupContent = "<table>";

        // Location Name
        if (
          feature.properties["LocationName"] !== null &&
          feature.properties["LocationName"] !== undefined
        ) {
          popupContent +=
            '\
                    <tr>\
                        <td style="font-weight: bold; color: #333;"><strong>Location</strong></td>\
                    </tr>\
                    <tr>\
                        <td>' +
            autolinker.link(
              String(feature.properties["LocationName"]).replace(/'/g, "'")
            ) +
            "</td>\
                    </tr>";
        }

        // Ward Name
        if (
          feature.properties["WARD_NAME"] !== null &&
          feature.properties["WARD_NAME"] !== undefined
        ) {
          popupContent +=
            '\
                    <tr>\
                        <td style="font-weight: bold; color: #333;"><strong>Ward Name</strong></td>\
                    </tr>\
                    <tr>\
                        <td>' +
            autolinker.link(
              String(feature.properties["WARD_NAME"]).replace(/'/g, "'")
            ) +
            "</td>\
                    </tr>";
        }

        // Ward Number
        if (
          feature.properties["WARDNO"] !== null &&
          feature.properties["WARDNO"] !== undefined
        ) {
          popupContent +=
            '\
                    <tr>\
                        <td style="font-weight: bold; color: #333;"><strong>Ward Number</strong></td>\
                    </tr>\
                    <tr>\
                        <td>' +
            Number(feature.properties["WARDNO"]).toFixed(0) +
            "</td>\
                    </tr>";
        }

        // Zone
        if (
          feature.properties["ZONE"] !== null &&
          feature.properties["ZONE"] !== undefined
        ) {
          popupContent +=
            '\
                    <tr>\
                        <td style="font-weight: bold; color: #333;"><strong>Zone</strong></td>\
                    </tr>\
                    <tr>\
                        <td>' +
            autolinker.link(
              String(feature.properties["ZONE"]).replace(/'/g, "'")
            ) +
            "</td>\
                    </tr>";
        }

        popupContent += "</table>";
        var content = removeEmptyRowsFromPopupContent(popupContent, feature);
        layer.bindPopup(content, { maxHeight: 400 });
      }

      setBounds();
      var baseMaps = {
        "Color Base": layer_OSMStandard_0,
        "B&W Base": layer_OSMBW,
        "No Base": layer_NoBase,
      };
      var overlayMaps = {
        Municipalities: layer_municipalities,
        Wards: layer_wards,
        Lakes: layer_lakes,
        "SWD Primary": layer_swd_primary,
        "SWD Secondary": layer_swd_secondary,
        "Flooding Locations": layer_flooding_locations,
      };
      L.control
        .layers(baseMaps, overlayMaps, {
          position: "topright",
          collapsed: false,
        })
        .addTo(map);
    </script>
  </body>
</html>
