<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="stylesheet" href="css/leaflet.css" />
    <link rel="stylesheet" href="css/L.Control.Layers.Tree.css" />
    <link rel="stylesheet" href="css/qgis2web.css" />
    <link rel="stylesheet" href="css/fontawesome-all.min.css" />
    <link rel="stylesheet" href="css/leaflet.photon.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
      }
      #map {
        width: 100vw;
        height: 100vh;
      }
      .leaflet-control-layers-toggle {
        display: none !important;
      }
      .leaflet-control-layers {
        padding: 10px !important;
      }
      .leaflet-right .leaflet-control {
        margin-right: 20px !important;
      }
    </style>
    <title></title>
  </head>
  <body>
    <div id="map"></div>
    <script src="js/qgis2web_expressions.js"></script>
    <script src="js/leaflet.js"></script>
    <script src="js/L.Control.Layers.Tree.min.js"></script>
    <script src="js/leaflet.rotatedMarker.js"></script>
    <script src="js/leaflet.pattern.js"></script>
    <script src="js/leaflet-hash.js"></script>
    <script src="js/Autolinker.min.js"></script>
    <script src="js/rbush.min.js"></script>
    <script src="js/labelgun.min.js"></script>
    <script src="js/labels.js"></script>
    <script src="js/leaflet.photon.js"></script>
    <script src="data/municipalities.js"></script>
    <script src="data/wards.js"></script>
    <script src="data/lakes.js"></script>
    <script>
      var highlightLayer;
      function highlightFeature(e) {
        highlightLayer = e.target;

        if (
          e.target.feature.geometry.type === "LineString" ||
          e.target.feature.geometry.type === "MultiLineString"
        ) {
          highlightLayer.setStyle({
            color: "#ffff00",
          });
        } else {
          highlightLayer.setStyle({
            fillColor: "#ffff00",
            fillOpacity: 0.3,
          });
        }
      }

      var map = L.map("map", {
        zoomControl: false,
        maxZoom: 28,
        minZoom: 1,
      }).fitBounds([
        [12.807248991172795, 77.33959259033578],
        [13.17872576117281, 77.94952630491066],
      ]);
      var hash = new L.Hash(map);
      map.attributionControl.setPrefix("");
      var autolinker = new Autolinker({
        truncate: { length: 30, location: "smart" },
      });
      // remove popup's row if "visible-with-data"
      function removeEmptyRowsFromPopupContent(content, feature) {
        var tempDiv = document.createElement("div");
        tempDiv.innerHTML = content;
        var rows = tempDiv.querySelectorAll("tr");
        for (var i = 0; i < rows.length; i++) {
          var td = rows[i].querySelector("td.visible-with-data");
          var key = td ? td.id : "";
          if (
            td &&
            td.classList.contains("visible-with-data") &&
            feature.properties[key] == null
          ) {
            rows[i].parentNode.removeChild(rows[i]);
          }
        }
        return tempDiv.innerHTML;
      }
      var zoomControl = L.control
        .zoom({
          position: "topleft",
        })
        .addTo(map);
      var bounds_group = new L.featureGroup([]);
      function setBounds() {}
      map.createPane("pane_OSMStandard_0");
      map.getPane("pane_OSMStandard_0").style.zIndex = 400;
      var layer_OSMStandard_0 = L.tileLayer(
        "http://tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          pane: "pane_OSMStandard_0",
          opacity: 1.0,
          attribution: "",
          minZoom: 1,
          maxZoom: 28,
          minNativeZoom: 0,
          maxNativeZoom: 19,
        }
      );
      layer_OSMStandard_0;
      map.addLayer(layer_OSMStandard_0);
      function pop_municipalities(feature, layer) {
        layer.on({
          mouseout: function (e) {
            for (var i in e.target._eventParents) {
              if (typeof e.target._eventParents[i].resetStyle === "function") {
                e.target._eventParents[i].resetStyle(e.target);
              }
            }
          },
          mouseover: highlightFeature,
        });
        var popupContent =
          '<table>\
                    <tr>\
                        <td style="font-weight: bold; color: #333;"><strong>Municipality</strong></td>\
                    </tr>\
                    <tr>\
                        <td>' +
          (feature.properties["NewCorp"] !== null
            ? autolinker.link(
                String(feature.properties["NewCorp"])
                  .replace(/'/g, "'")
                  .toLocaleString()
              )
            : "") +
          "</td>\
                    </tr>\
                </table>";
        var content = removeEmptyRowsFromPopupContent(popupContent, feature);
        layer.bindPopup(content, { maxHeight: 400 });
      }

      function pop_wards(feature, layer) {
        layer.on({
          mouseout: function (e) {
            for (var i in e.target._eventParents) {
              if (typeof e.target._eventParents[i].resetStyle === "function") {
                e.target._eventParents[i].resetStyle(e.target);
              }
            }
          },
          mouseover: highlightFeature,
        });
        var popupContent =
          '<table>\
                    <tr>\
                        <td style="font-weight: bold; color: #333;"><strong>Ward</strong></td>\
                    </tr>\
                    <tr>\
                        <td>' +
          (feature.properties["ward_name"] !== null
            ? autolinker.link(
                String(feature.properties["ward_name"])
                  .replace(/'/g, "'")
                  .toLocaleString()
              )
            : "") +
          "</td>\
                </table>";
        var content = removeEmptyRowsFromPopupContent(popupContent, feature);
        layer.bindPopup(content, { maxHeight: 400 });
      }

      function style_municipalities() {
        return {
          pane: "pane_municipalities",
          opacity: 1,
          color: "rgba(0,0,0,1.0)",
          dashArray: "",
          lineCap: "butt",
          lineJoin: "miter",
          weight: 3,
          fill: true,
          fillOpacity: 0.2,
          fillColor: "rgba(255,255,255,1.0)",
          interactive: true,
        };
      }
      function style_wards() {
        return {
          pane: "pane_wards",
          opacity: 1,
          color: "rgba(0,0,0,1.0)",
          dashArray: "",
          lineCap: "butt",
          lineJoin: "miter",
          weight: 1.0,
          fill: true,
          fillOpacity: 0.4,
          fillColor: "rgba(255,158,23,1.0)",
          interactive: true,
        };
      }
      map.createPane("pane_municipalities");
      map.getPane("pane_municipalities").style.zIndex = 401;
      map.getPane("pane_municipalities").style["mix-blend-mode"] = "normal";
      var layer_municipalities = new L.geoJson(json_municipalities, {
        attribution: "",
        interactive: true,
        dataVar: "json_municipalities",
        layerName: "layer_municipalities",
        pane: "pane_municipalities",
        onEachFeature: pop_municipalities,
        style: style_municipalities,
      });
      bounds_group.addLayer(layer_municipalities);
      map.addLayer(layer_municipalities);
      map.createPane("pane_wards");
      map.getPane("pane_wards").style.zIndex = 402;
      map.getPane("pane_wards").style["mix-blend-mode"] = "normal";
      var layer_wards = new L.geoJson(json_wards, {
        attribution: "",
        interactive: true,
        dataVar: "json_wards",
        layerName: "layer_wards",
        pane: "pane_wards",
        onEachFeature: pop_wards,
        style: style_wards,
      });
      bounds_group.addLayer(layer_wards);
      map.addLayer(layer_wards);

      function pop_lakes(feature, layer) {
        layer.on({
          mouseout: function (e) {
            for (var i in e.target._eventParents) {
              if (typeof e.target._eventParents[i].resetStyle === "function") {
                e.target._eventParents[i].resetStyle(e.target);
              }
            }
          },
          mouseover: highlightFeature,
        });
        var popupContent =
          '<table>\
                    <tr>\
                        <td style="font-weight: bold; color: #333;"><strong>Lake Name</strong></td>\
                    </tr>\
                    <tr>\
                        <td>' +
          (feature.properties["Name_of_th"] !== null
            ? autolinker.link(
                String(feature.properties["Name_of_th"])
                  .replace(/'/g, "'")
                  .toLocaleString()
              )
            : "") +
          '</td>\
                    </tr>\
                    <tr>\
                        <td style="font-weight: bold; color: #333;"><strong>Area (acres)</strong></td>\
                    </tr>\
                    <tr>\
                        <td>' +
          (feature.properties["Area"] !== null
            ? autolinker.link(
                String(feature.properties["Area"])
                  .replace(/'/g, "'")
                  .toLocaleString()
              )
            : "") +
          '</td>\
                    </tr>\
                    <tr>\
                        <td style="font-weight: bold; color: #333;"><strong>Ward Name</strong></td>\
                    </tr>\
                    <tr>\
                        <td>' +
          (feature.properties["Ward_Name"] !== null
            ? autolinker.link(
                String(feature.properties["Ward_Name"])
                  .replace(/'/g, "'")
                  .toLocaleString()
              )
            : "") +
          "</td>\
                    </tr>\
                </table>";
        var content = removeEmptyRowsFromPopupContent(popupContent, feature);
        layer.bindPopup(content, { maxHeight: 400 });
      }

      function style_lakes() {
        return {
          pane: "pane_lakes",
          opacity: 1,
          color: "rgba(35,35,35,1.0)",
          dashArray: "",
          lineCap: "butt",
          lineJoin: "miter",
          weight: 1.0,
          fill: true,
          fillOpacity: 0.7,
          fillColor: "rgba(0,123,255,1.0)",
          interactive: true,
        };
      }

      map.createPane("pane_lakes");
      map.getPane("pane_lakes").style.zIndex = 403;
      map.getPane("pane_lakes").style["mix-blend-mode"] = "normal";
      var layer_lakes = new L.geoJson(json_lakes, {
        attribution: "",
        interactive: true,
        dataVar: "json_lakes",
        layerName: "layer_lakes",
        pane: "pane_lakes",
        onEachFeature: pop_lakes,
        style: style_lakes,
      });
      bounds_group.addLayer(layer_lakes);
      map.addLayer(layer_lakes);

      setBounds();
      var baseMaps = {};
      var overlayMaps = {
        Municipalities: layer_municipalities,
        Wards: layer_wards,
        Lakes: layer_lakes,
      };
      L.control
        .layers(baseMaps, overlayMaps, {
          position: "topright",
          collapsed: false,
        })
        .addTo(map);
    </script>
  </body>
</html>
